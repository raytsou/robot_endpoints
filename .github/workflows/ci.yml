name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - name: Install linters
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            clang-format-14 \
            clang-tidy-14 \
            python3-venv
          python3 -m venv "${{ runner.temp }}/gersemi"
          "${{ runner.temp }}/gersemi/bin/pip" install gersemi==0.29.1

      - name: Validate Clang configuration
        run: |
          clang-format-14 \
            --style=file \
            --assume-filename=include/robot_endpoints/dummy.hpp \
            --dump-config >/dev/null
          clang-tidy-14 \
            --config-file=.clang-tidy \
            --dump-config >/dev/null

      - name: Check C++ formatting
        run: |
          git ls-files -z -- \
            '*.cc' '*.cpp' '*.cxx' \
            '*.h' '*.hh' '*.hpp' '*.hxx' |
            xargs -0 -r clang-format-14 --dry-run --Werror

      - name: Check C++ diagnostics
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            case "$file" in
              *.h | *.hh | *.hpp | *.hxx)
                language=c++-header
                ;;
              *)
                language=c++
                ;;
            esac

            clang-tidy-14 \
              --config-file=.clang-tidy \
              "$file" \
              -- \
              -x "$language" \
              -std=c++17 \
              -Iinclude \
              -Wall \
              -Wextra \
              -Wpedantic
          done < <(
            git ls-files -z -- \
              '*.cc' '*.cpp' '*.cxx' \
              '*.h' '*.hh' '*.hpp' '*.hxx'
          )

      - name: Check CMake formatting
        run: |
          "${{ runner.temp }}/gersemi/bin/gersemi" \
            --check \
            --diff \
            CMakeLists.txt \
            cmake

      - name: Check CMake package
        run: |
          cmake -S . -B build
          cmake --build build
          cmake --install build --prefix "${{ runner.temp }}/install"
