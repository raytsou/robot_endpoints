name: Format

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - name: Install formatters
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            clang-format-14 \
            python3-venv
          python3 -m venv "${{ runner.temp }}/gersemi"
          "${{ runner.temp }}/gersemi/bin/pip" install gersemi==0.29.1

      - name: Validate clang-format configuration
        run: |
          clang-format-14 \
            --style=file \
            --assume-filename=include/robot_endpoints/dummy.hpp \
            --dump-config >/dev/null

      - name: Check C++ formatting
        run: |
          git ls-files -z -- \
            '*.cc' '*.cpp' '*.cxx' \
            '*.h' '*.hh' '*.hpp' '*.hxx' |
            xargs -0 -r clang-format-14 --dry-run --Werror

      - name: Check CMake formatting
        run: |
          "${{ runner.temp }}/gersemi/bin/gersemi" \
            --check \
            --diff \
            CMakeLists.txt \
            cmake
